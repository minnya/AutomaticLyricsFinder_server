name: Check API Status

on:
  schedule:
    - cron: "0 6 * * * *"  # 1日1回実行
  workflow_dispatch:  # 手動実行も可能
  
jobs:
  check_api:
    runs-on: ubuntu-latest
    steps:
      - name: APIをチェック
        id: check_api
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "X-Api-Key: ${{ secrets.API_KEY }}" ${{ env.BASE_URL }}/search-lyrics?artist=justin%20bieber&title=baby)
          if [ "$RESPONSE" -ne 200 ]; then
            echo "::error title=API Check::Automatic Lyrics Server is down! Status: $RESPONSE"
            exit 1
          else
            echo "API is running fine."
